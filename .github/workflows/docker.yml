name: Release Nova Panel for Docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  verify-manifest:
    name: Verify published manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/ruofei-nova/novapanel:${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check every advertised platform
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          jq -r '.manifests[].platform |
            if .variant then "\(.os)/\(.architecture)/\(.variant)"
            else "\(.os)/\(.architecture)" end' manifest.json | sort -u > platforms.txt
          cat platforms.txt
          for platform in \
            linux/386 \
            linux/amd64 \
            linux/arm/v6 \
            linux/arm/v7 \
            linux/arm64/v8; do
            grep -Fx "$platform" platforms.txt
          done

  runtime-smoke:
    name: Runtime smoke (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            xray: amd64
            mtg: amd64
          - platform: linux/arm64/v8
            slug: arm64
            xray: arm64
            mtg: arm64
          - platform: linux/arm/v7
            slug: armv7
            xray: arm32
            mtg: arm
          - platform: linux/arm/v6
            slug: armv6
            xray: arm32
            mtg: arm
          - platform: linux/386
            slug: "386"
            xray: 386
            mtg: 386
    env:
      IMAGE: ghcr.io/ruofei-nova/novapanel:${{ github.ref_name }}
    steps:
      - uses: docker/setup-qemu-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify binaries and start the panel
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "$IMAGE"
          docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint /bin/sh "$IMAGE" -ec \
            '/app/x-ui -v; test -x /app/bin/xray-linux-${{ matrix.xray }}; test -x /app/bin/mtg-linux-${{ matrix.mtg }}'

          name="novapanel-smoke-${{ matrix.slug }}"
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --platform "${{ matrix.platform }}" \
            -e XUI_ENABLE_FAIL2BAN=false "$IMAGE"
          for attempt in 1 2 3 4 5; do
            test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
            sleep 2
          done
