name: Release Nova Panel

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "internal/config/version"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "internal/config/version"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"

jobs:
  release-preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify version and tag agree
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < internal/config/version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "internal/config/version is not a semantic version: $version" >&2
            exit 1
          }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected="v${version}"
            [[ "$GITHUB_REF_NAME" == "$expected" ]] || {
              echo "release tag $GITHUB_REF_NAME does not match internal version $expected" >&2
              exit 1
            }
          fi

  build:
    needs: release-preflight
    permissions:
      contents: read
    env:
      XRAY_VERSION: v26.7.11
      MTG_MULTI_VERSION: v1.15.0
      GEODATA_VERSION: "202607242256"
      IRAN_GEODATA_VERSION: "202607250659"
      RUSSIA_GEODATA_VERSION: "202607251625"
    strategy:
      # One platform hitting a transient outage must not cancel the other six.
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build Nova Panel
        run: |
          CURL_RETRY="--retry 8 --retry-all-errors --retry-delay 5"
          fetch() { wget -q --tries=8 --waitretry=10 --retry-on-http-error=429,500,502,503,504 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
            armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
            armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
            armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
            386) BOOTLIN_ARCH="x86-i686" ;;
            s390x) BOOTLIN_ARCH="s390x-z13" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS $CURL_RETRY -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -ldflags "$LDFLAGS" -o xui-release -v main.go
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            fetch ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v7a.zip
            unzip Xray-linux-arm32-v7a.zip
            rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v6.zip
            unzip Xray-linux-arm32-v6.zip
            rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "386" ]; then
            fetch ${Xray_URL}Xray-linux-32.zip
            unzip Xray-linux-32.zip
            rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            fetch ${Xray_URL}Xray-linux-arm32-v5.zip
            unzip Xray-linux-arm32-v5.zip
            rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            fetch ${Xray_URL}Xray-linux-s390x.zip
            unzip Xray-linux-s390x.zip
            rm -f Xray-linux-s390x.zip
          fi
          rm -f geoip.dat geosite.dat
          fetch "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEODATA_VERSION}/geoip.dat"
          fetch "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEODATA_VERSION}/geosite.dat"
          fetch -O geoip_IR.dat "https://github.com/chocolate4u/Iran-v2ray-rules/releases/download/${IRAN_GEODATA_VERSION}/geoip.dat"
          fetch -O geosite_IR.dat "https://github.com/chocolate4u/Iran-v2ray-rules/releases/download/${IRAN_GEODATA_VERSION}/geosite.dat"
          fetch -O geoip_RU.dat "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/download/${RUSSIA_GEODATA_VERSION}/geoip.dat"
          fetch -O geosite_RU.dat "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/download/${RUSSIA_GEODATA_VERSION}/geosite.dat"
          mv xray xray-linux-${{ matrix.platform }}
          # mtg-multi (MTProto sidecar) ships prebuilt release binaries whose
          # platform labels match our matrix, so download and unpack the matching
          # archive. Only the platforms the fork publishes are packaged — the tag
          # lookup lives inside that branch so unpackaged platforms (s390x) never
          # depend on it. The tag comes from the release-page redirect on
          # github.com — the host the downloads need anyway — because api.github.com
          # has 503'd whole release runs while asset downloads kept working.
          case "${{ matrix.platform }}" in
            amd64|arm64|armv7|armv6|armv5|386|s390x)
              MTG_PKG="mtg-multi-${MTG_MULTI_VERSION#v}-linux-${{ matrix.platform }}"
              curl -sfLRO $CURL_RETRY "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VERSION}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          cd ../..

      - name: Package
        run: tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: ./x-ui-linux-${{ matrix.platform }}.tar.gz

  # =================================
  #  Windows Build
  # =================================
  build-windows:
    name: Build for Windows
    needs: release-preflight
    permissions:
      contents: read
    env:
      XRAY_VERSION: v26.7.11
      MTG_MULTI_VERSION: v1.15.0
      GEODATA_VERSION: "202607242256"
      IRAN_GEODATA_VERSION: "202607250659"
      RUSSIA_GEODATA_VERSION: "202607251625"
    strategy:
      matrix:
        platform:
          - amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — see comment on the
      # Linux job above. This step is identical except npm runs on the
      # Windows runner here.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        shell: pwsh
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Build Nova Panel for Windows (CGO)
        shell: msys2 {0}
        run: |
          export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          export CC=x86_64-w64-mingw32-gcc

          which go
          go version
          gcc --version

          # Stamp the commit into per-commit (dev channel) builds only.
          LDFLAGS="-w -s"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA:0:8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -ldflags "$LDFLAGS" -o xui-release.exe -v main.go

      - name: Copy and download resources
        shell: pwsh
        run: |
          $retry = @{ MaximumRetryCount = 8; RetryIntervalSec = 10 }
          mkdir x-ui
          Copy-Item xui-release.exe x-ui\x-ui.exe
          mkdir x-ui\bin
          cd x-ui\bin

          # Download Xray for Windows
          $Xray_URL = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/"
          Invoke-WebRequest @retry -Uri "${Xray_URL}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath .
          Remove-Item "Xray-windows-64.zip"
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest @retry -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$env:GEODATA_VERSION/geoip.dat" -OutFile "geoip.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$env:GEODATA_VERSION/geosite.dat" -OutFile "geosite.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/download/$env:IRAN_GEODATA_VERSION/geoip.dat" -OutFile "geoip_IR.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/download/$env:IRAN_GEODATA_VERSION/geosite.dat" -OutFile "geosite_IR.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/download/$env:RUSSIA_GEODATA_VERSION/geoip.dat" -OutFile "geoip_RU.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/download/$env:RUSSIA_GEODATA_VERSION/geosite.dat" -OutFile "geosite_RU.dat"
          Rename-Item xray.exe xray-windows-amd64.exe

          # mtg-multi (MTProto sidecar) publishes a prebuilt Windows binary, so
          # download and unpack it instead of compiling. The tag comes from the
          # release-page redirect on github.com — not api.github.com, whose
          # outages have failed release runs while asset downloads kept working.
          $MTG_PKG = "mtg-multi-$($env:MTG_MULTI_VERSION.TrimStart('v'))-windows-amd64"
          curl.exe -sfLRO --retry 8 --retry-all-errors --retry-delay 5 "https://github.com/mhsanaei/mtg-multi/releases/download/$env:MTG_MULTI_VERSION/$MTG_PKG.zip"
          Expand-Archive -Path "$MTG_PKG.zip" -DestinationPath "mtg-tmp" -Force
          Move-Item "mtg-tmp/$MTG_PKG/mtg-multi.exe" "mtg-windows-amd64.exe"
          Remove-Item -Recurse -Force "mtg-tmp", "$MTG_PKG.zip"

          cd ..
          Copy-Item -Path ..\windows_files\* -Destination . -Recurse
          cd ..

      - name: Package to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path .\x-ui -DestinationPath "x-ui-windows-amd64.zip"

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-windows-amd64
          path: ./x-ui-windows-amd64.zip

  validate-linux-artifacts:
    name: Execute Linux artifact (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64, armv7, armv6, armv5, 386, s390x]
    steps:
      - uses: docker/setup-qemu-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: x-ui-linux-${{ matrix.platform }}
      - name: Extract and execute packaged binaries
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "x-ui-linux-${{ matrix.platform }}.tar.gz"
          test -x x-ui/x-ui
          test -x "x-ui/bin/xray-linux-${{ matrix.platform }}"
          test -x "x-ui/bin/mtg-linux-${{ matrix.platform }}"
          timeout 30s x-ui/x-ui -v
          timeout 30s "x-ui/bin/xray-linux-${{ matrix.platform }}" version
          timeout 30s "x-ui/bin/mtg-linux-${{ matrix.platform }}" --version

  validate-windows-artifact:
    name: Execute Windows artifact
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: x-ui-windows-amd64
      - name: Extract and execute packaged binaries
        shell: pwsh
        run: |
          Expand-Archive -Path x-ui-windows-amd64.zip -DestinationPath extracted
          if (-not (Test-Path extracted\x-ui\x-ui.exe)) { throw "x-ui.exe missing" }
          if (-not (Test-Path extracted\x-ui\bin\xray-windows-amd64.exe)) { throw "xray executable missing" }
          if (-not (Test-Path extracted\x-ui\bin\mtg-windows-amd64.exe)) { throw "mtg executable missing" }
          & extracted\x-ui\x-ui.exe -v
          if ($LASTEXITCODE -ne 0) { throw "x-ui.exe failed" }
          & extracted\x-ui\bin\xray-windows-amd64.exe version
          if ($LASTEXITCODE -ne 0) { throw "xray executable failed" }
          & extracted\x-ui\bin\mtg-windows-amd64.exe --version
          if ($LASTEXITCODE -ne 0) { throw "mtg executable failed" }

  publish-stable:
    name: Publish complete stable release
    needs: [release-preflight, validate-linux-artifacts, validate-windows-artifact]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify and publish atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            x-ui-linux-386.tar.gz
            x-ui-linux-amd64.tar.gz
            x-ui-linux-arm64.tar.gz
            x-ui-linux-armv5.tar.gz
            x-ui-linux-armv6.tar.gz
            x-ui-linux-armv7.tar.gz
            x-ui-linux-s390x.tar.gz
            x-ui-windows-amd64.zip
          )
          for asset in "${expected[@]}"; do
            test -s "release-artifacts/$asset" || {
              echo "missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          artifact_count="$(find release-artifacts -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "$artifact_count" -eq "${#expected[@]}" || {
            echo "expected ${#expected[@]} platform assets, found $artifact_count" >&2
            exit 1
          }
          (
            cd release-artifacts
            sha256sum "${expected[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          notes="NovaPanel ${TAG}. All platform artifacts completed successfully before this release was made public. Verify downloads with the attached SHA256SUMS file."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "NovaPanel $TAG" --notes "$notes"
          else
            gh release create "$TAG" --verify-tag --draft --title "NovaPanel $TAG" --notes "$notes"
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest

  # =================================
  #  Rolling dev channel (per-commit)
  # =================================
  # Publishes/overwrites the build artifacts to a single fixed-tag pre-release
  # `dev-latest`, force-moved to the new commit on every push to main. The panel's
  # "Dev" update channel installs from this tag. `--latest=false` is load-bearing:
  # it keeps releases/latest pointing at the real stable tag, so the stable
  # channel is unaffected.
  publish-dev:
    name: Publish rolling dev release
    needs: [validate-linux-artifacts, validate-windows-artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload, or the dev
    # release could be left with a partial asset set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build — installs via the panel's Dev update channel.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          (
            cd dev-artifacts
            sha256sum *.tar.gz *.zip > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          # The release exists on every run but the first; edit-first avoids an
          # existence probe that can 503 and mis-route into create (422).
          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.zip dev-artifacts/SHA256SUMS --clobber
